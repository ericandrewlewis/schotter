<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.0.16/svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    .svg-container {
      text-align: center;
      margin-top: 100px;
    }
  </style>

</head>
<body>
  <div class="svg-container"></div>
  <script>
    const draw = SVG().addTo('.svg-container').size(900, 1300);
    // 12 x 20 grid
    // https://collections.vam.ac.uk/item/O221321/schotter-print-nees-georg?carousel-image=2009CE0997
    let padding = 50;
    for (let i = 0; i < 20; i++) {
      let yOffset = padding + i * 50;
      let chaos = 0.02 * i;
      for ( let j = 0; j < 12; j++) {
        let xOffset = padding + j * 50;
        draw.rect(50, 50)
          .x(xOffset).y(yOffset)
          .fill('rgba(0,0,0,0)')
          .stroke({ color: 'black', width: 2 })
          .transform({
            rotate: 0 + Math.floor(Math.random() * 90 - 45) * chaos,
            translateX: 0 + Math.floor(Math.random() * 50 - 20) * chaos,
            translateY: 0 + Math.floor(Math.random() * 50 - 20) * chaos,
            // translateY: 100,
            // scale: 3
          })
      }
    }
  </script>
</body>
</html>
